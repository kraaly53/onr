# Builds the site and uploads it to the test server on every push to main.
name: Deploy Website via FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build and FTP deploy
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: Install
      run: npm ci

    - name: Build the site
      # The site is published in a sub-folder, so every link is written with this prefix.
      run: |
        npm run build
        # web server needs to read files (644) and open folders (755); mirror copies these permissions up
        find _site -type d -exec chmod 755 {} +
        find _site -type f -exec chmod 644 {} +
      env:
        PATH_PREFIX: /testing/onr/

    - name: Install lftp
      run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

    - name: Upload to server
      # lftp reconnects and retries automatically, so a dropped FTP connection doesn't stop the deploy.
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}   # read by --env-password, so any characters are safe
        REMOTE_DIR: /public_html/ordinaryspoon.com/testing/onr
      run: |
        lftp -c "
          set ftp:ssl-allow no;
          set ftp:passive-mode yes;
          set net:timeout 30;
          set net:max-retries 10;
          set net:reconnect-interval-base 5;
          set net:reconnect-interval-max 30;
          open --env-password -u \"$FTP_USERNAME\" -p 21 \"$FTP_SERVER\";
          mirror --reverse --parallel=2 --verbose=1 _site/ \"$REMOTE_DIR\";
        "

    - name: Check the site is live
      run: |
        for page in "" team.html assets/css/site.css; do
          code=$(curl -s -o /dev/null -w '%{http_code}' -L "https://www.ordinaryspoon.com/testing/onr/$page")
          echo "$code  /testing/onr/$page"
          [ "$code" = "200" ] || failed=1
        done
        [ -z "$failed" ] || { echo "::error::The site isn't loading at https://www.ordinaryspoon.com/testing/onr/"; exit 1; }
