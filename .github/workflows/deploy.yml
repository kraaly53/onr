# Builds the site and uploads it to the test server on every push to main.
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build and FTP deploy
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: Install
      run: npm ci

    - name: Build the site
      # The site is published in a sub-folder, so every link is written with this prefix.
      run: npm run build
      env:
        PATH_PREFIX: /testing/onr/

    - name: Sync files to server
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./_site/
        server-dir: /public_html/ordinaryspoon.com/testing/onr/
        port: 21
        protocol: ftp
        timeout: 60000
