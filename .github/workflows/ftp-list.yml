# One-off: list where the FTP upload lands. Run manually, then delete.
name: FTP folder listing (temporary)
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
    - name: Install lftp
      run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
    - name: List folders
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: |
        lftp -c "set ftp:ssl-allow no; set ftp:passive-mode yes; open --env-password -u \"$FTP_USERNAME\" -p 21 \"$FTP_SERVER\";
          echo '== login folder'; pwd;
          echo '== login folder contents'; cls -l --sort=name . ;
          echo '== /public_html/ordinaryspoon.com'; cls -l --sort=name /public_html/ordinaryspoon.com/ ;
          echo '== testing'; cls -l --sort=name /public_html/ordinaryspoon.com/testing/ ;
          echo '== testing/onr (first 15)'; cls -l --sort=name /public_html/ordinaryspoon.com/testing/onr/ | head -n 15" || true
